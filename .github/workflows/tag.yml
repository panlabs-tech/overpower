# Publishing is merging: a merge into `main` that moved the version creates the
# tag and dispatches the release; a merge that did not moves nothing.
# https://github.com/panlabs-tech/overpower/issues/24
#
# "Every merge publishes" does not survive this repository's own history —
# measured, 2 of 10 commits changed the version, and the other 8 would have
# called `uv publish` on a version PyPI already has, which it refuses. So the
# version bump is the signal.
#
# The bump is written by the author of the pull request, never by a workflow,
# and the `release-ready` check in `ci.yml` is what makes it non-optional —
# docs/adr/0012-o-bump-e-ato-do-autor-e-o-portao-o-ensina.md. That check also
# turns the third branch below from "unlikely" into "unreachable except by
# bypass", which is why it is an error and not a notice.
#
# THE DISPATCH IS NOT DECORATION. In GitHub's own words: "With the exception of
# `workflow_dispatch` and `repository_dispatch`, other `GITHUB_TOKEN`-triggered
# events do not create workflow runs at all." A tag pushed from here with the
# default token would NOT fire `release.yml` through its `push: tags` trigger:
# green merge, tag present, nothing published, no error — the failure class this
# map has been catching since #2. `workflow_dispatch` is the documented
# exception, and using it keeps every property the release path was built for:
# zero credentials, the workflow filename untouched (it is part of the trusted
# publisher match, and the *event* is not), and the tag-versus-version guard,
# because `--ref` accepts a tag name and `GITHUB_REF_NAME` is the tag again.
name: Tag a version bump

on:
  push:
    branches: [main]

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the tag
      actions: write # dispatch release.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are what makes this idempotent, so they have to be fetched.
          fetch-tags: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Read the declared version
        id: declared
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      # Existence of the tag, and not a diff against the previous commit, is the
      # condition. A diff answers "did this push change it", which is wrong for
      # a re-run, for a revert and for a merge that brings the bump in from an
      # older commit; the tag answers "has this version been released", which is
      # the question.
      #
      # THREE BRANCHES, AND THE THIRD ONE IS WHY THIS FILE CHANGED. It used to
      # have two, and "tag exists" alone printed a `::notice::` and went green.
      # Measured: after v0.1.0 three pull requests merged without moving the
      # version, this step ran three times, went green three times, and nothing
      # was published — the failure surfaced only as a `pip install --upgrade`
      # that brought nothing back. Splitting on *where the tag points* separates
      # the benign case (a re-run of this very workflow, whose idempotency the
      # paragraph above declares as a property) from the one that means main
      # advanced without a bump.
      - name: Has this version already been tagged?
        id: state
        env:
          VERSION: ${{ steps.declared.outputs.version }}
        run: |
          # `^{commit}` dereferences an annotated tag; without it the comparison
          # against HEAD would be tag-object against commit and never match.
          if ! tagged="$(git rev-parse -q --verify "refs/tags/v${VERSION}^{commit}")"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$tagged" = "$(git rev-parse HEAD)" ]; then
            echo "::notice::v${VERSION} already points at this commit; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::main is at $(git rev-parse --short HEAD) and still declares ${VERSION}, which v${VERSION} already released at $(git rev-parse --short "$tagged"). A merge advanced main without moving the version, so nothing will be published."
            echo "::error::fix it with a pull request that bumps: uv version --bump <patch|minor|major> && uv run towncrier build --version \"\$(uv version --short)\""
            exit 1
          fi

      - name: Tag and dispatch the release
        if: steps.state.outputs.release == 'true'
        env:
          VERSION: ${{ steps.declared.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh workflow run release.yml --ref "v${VERSION}"
          echo "::notice::tagged v${VERSION} and dispatched release.yml"
