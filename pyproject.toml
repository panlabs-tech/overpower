[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "overpower"
version = "0.0.1"
description = "Instala AI Frameworks curados num repositorio ou na maquina"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thiago Panini" }]
keywords = ["ai", "agent", "skills", "claude", "cursor", "codex"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Code Generators",
]

# Zero runtime dependencies is deliberate while the 0.0.x series exists: an
# install failure has to measure `overpower` and nothing else. With typer/rich
# in the tree, a failure would be ambiguous between our own package and the
# mirroring of its transitives. The CLI stack decided in #4 lands in v0.1.0.
dependencies = []

[project.urls]
Repository = "https://github.com/panlabs-tech/overpower"
Issues = "https://github.com/panlabs-tech/overpower/issues"

[project.scripts]
# package == command == `overpower`. `uvx <name>` resolves by *command* and
# infers the package by name equality; diverging forces `--from`.
# Measured in https://github.com/panlabs-tech/overpower/issues/3
overpower = "overpower.cli:main"

# There is no `[tool.hatch.build...]` here, and the absence is a measured
# decision: docs/adr/0004-build-nao-forca-inclusao-de-conteudo.md
# Any `force-include`, `artifacts`, `packages` or `ignore-vcs` appearing in this
# file is a regression until proven otherwise, and the proof has to come from a
# CI build off a clean clone.
