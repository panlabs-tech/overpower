# THE NAME OF THIS FILE IS PART OF THE CREDENTIAL.
#
# The PyPI trusted publisher matches owner + repository + workflow *filename* +
# environment. Renaming `release.yml` invalidates publishing, with an error that
# never mentions the file name.
name: Publish release to PyPI

on:
  push:
    tags: ["v*"] # the manual path, preserved
  # The automatic path. `tag.yml` cannot reach the line above: a tag created with
  # `GITHUB_TOKEN` fires no workflow at all, and `workflow_dispatch` is the
  # documented exception. The event does not participate in the trusted-publisher
  # match — owner, repository, workflow filename and environment do — so this
  # line costs nothing and buys the whole automatic release.
  # https://github.com/ThiagoPanini/overpower/issues/24
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/overpower
    permissions:
      # Required for trusted publishing OIDC, and it has to sit on the job, not
      # on the workflow. Missing it, uv fails with "Failed to obtain OIDC token".
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      # The tag and the version are two sources of truth for the same thing, and
      # letting them diverge either publishes the wrong version or fails on a
      # duplicate at the very end. Same class as the `hatch-vcs` shallow-clone
      # failure measured in #2: success carrying the wrong content.
      - name: Tag matches the pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv version --short)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} differs from version = \"${pkg}\" in pyproject.toml"
            exit 1
          fi
          echo "tag v${tag} == version ${pkg}"

      - name: Build
        run: uv build --no-sources

      - name: Inventory of what was built
        run: |
          ls -l dist/
          python3 -c "import zipfile,glob;[print(n) for n in sorted(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist())]"

      # The two smoke tests are not redundant. `uv build` builds the wheel *from
      # the sdist*, so the sdist test is the only one proving that content
      # survives the sdist -> wheel path — the trap in #3 section 2.3.
      - name: Smoke test the wheel
        run: uv run --isolated --no-project --with dist/*.whl -- overpower

      - name: Smoke test the sdist
        run: uv run --isolated --no-project --with dist/*.tar.gz -- overpower

      # No credential at all: `--trusted-publishing automatic` is the default and
      # exchanges the Actions OIDC token for a short-lived PyPI token.
      - name: Publish to PyPI
        run: uv publish
