# The documentation site, built and published to GitHub Pages.
#
# Independent of release, and deliberately so. Publishing the package is an act
# of the author — a merge that moves the version in `pyproject.toml` creates the
# tag and fires `release.yml`. Publishing the site is not: prose is corrected
# after the fact, and tying it to a version bump would mean either shipping a
# release to fix a typo or leaving the typo up until the next one.
#
# Nothing here can publish to PyPI. It never runs `uv build`, it holds no
# `id-token` scope for the `pypi` environment, and the only artifact it uploads
# is the static site.
#
# https://github.com/ThiagoPanini/overpower/issues/130
name: Deploy the documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and the queue does not cancel the one already in
# flight: `cancel-in-progress: true` here would abort a deploy mid-upload and
# leave Pages serving a half-written tree.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # On the job and not on the workflow, which is the shape `release.yml` and
    # `tag.yml` already use. It matters most here: this job runs `npm ci` over
    # third-party packages, and a workflow-level block would hand that step the
    # `id-token: write` that exchanges for a deployment credential. Only `deploy`
    # needs it. `pages: read` is what `configure-pages` reads the site config
    # with — it does not enable Pages, and `enablement` stays at its default.
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install the locked dependencies
        run: npm ci

      # The four gates are not repeated here. `ci.yml` runs them on every push,
      # including the push to `main` that triggers this workflow, and a gate that
      # runs twice on the same commit is a gate that takes twice as long to tell
      # you the same thing. What this job needs from the build is the build
      # itself — it is where the three `onBroken*: throw` fire.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Relative to the repository root, not to `defaults.run.working-directory`
          # — that key only reaches `run:` steps, never an action's inputs.
          path: website/build

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
