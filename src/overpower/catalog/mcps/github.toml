# The one server of this organisation whose secret travels in a header, taken
# from the template a fourth repository already carries — where the note next to
# it reads *"Codex typically needs a bearer via GITHUB_PAT_TOKEN"*.
#
# The word `Bearer` does not appear here on purpose: the role says what the
# secret is for, and the renderer assembles `Authorization: Bearer <secret>` out
# of it. That is what will let a target which spells the same intent as a field —
# Codex's `bearer_token_env_var` — be served from this very recipe, with no new
# field to add and nothing to re-read.
description = """\
GitHub's remote MCP server, reached over HTTP. It reads and writes issues, pull \
requests and workflows in the repositories your token can see, and it is \
authorised with a personal access token sent on every request.\
"""

transport = "http"

[server]
url = "https://api.githubcopilot.com/mcp"

[[slots]]
name = "GITHUB_PAT_TOKEN"
role = "bearer"
