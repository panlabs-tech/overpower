[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "overpower"
# Moved only by `uv version --bump`, and moving it is what publishes: the tagger
# workflow tags the merge and dispatches the release. A literal, never derived
# from the VCS — measured in #2, `hatch-vcs` under `git clone --depth 1` (the
# default of `actions/checkout`) fails to find the tag, warns, *succeeds*, and
# publishes an invented version.
version = "0.21.4"
description = "Installs curated AI Frameworks into a repository or a machine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# NOTICE carries the attribution the transcribed runtime path table and the two
# vendored content trees owe upstream; `licenses/` carries the upstream LICENSE
# files themselves, verbatim, because each of them lives at the root of its
# repository and therefore outside the vendored slice. PEP 639 puts all of them
# in `dist-info/licenses/`, which is why attribution travels with the package and
# never lands in the user's repository (ADR 0003). This is metadata, not build
# configuration: the four forbidden keys of ADR 0004 stay absent.
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [{ name = "Thiago Panini" }]
keywords = ["ai", "agent", "skills", "claude", "cursor", "codex"]
classifiers = [
  # `1 - Planning` was true of the `0.0.x` probe and is the same claim the README
  # notice made; both leave together in
  # https://github.com/panlabs-tech/overpower/issues/44. It stays `3 - Alpha` and
  # not `4 - Beta`: the graft class is exercised since
  # https://github.com/panlabs-tech/overpower/issues/76, but for **one** of the
  # three measured targets and with no slot, so the surface a user meets still
  # grows ticket by ticket.
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Code Generators",
]

# The CLI stack, fixed in https://github.com/panlabs-tech/overpower/issues/4.
# Measured cost of the three of them under `uvx`: +0.55 s cold, +0.04 s warm.
dependencies = [
  "typer>=0.27",
  "rich>=15",
  "questionary>=2.1",
  # A direct pin, not an inherited one. `questionary` only asks for
  # `>=2.0,<4.0`, and before 3.0.53 (2026-07-26) the no-TTY case on macOS leaks
  # a raw `OSError` that `except EOFError` does not catch.
  "prompt-toolkit>=3.0.53",
  # The graft's reader AND its writer, and both halves were forced:
  # docs/adr/0016-o-diff-aditivo-e-requisito.md. The stdlib does not *read* the
  # target — `json.loads` over a `.vscode/mcp.json` with a comment raises — and
  # writing with `json.dumps` reflows servers nobody touched, which breaks the
  # axiom that makes `git diff` the manifest.
  #
  # PACKAGING TRAP, measured: the PyPI package `json-five` installs the module
  # `json5`, which is also the module name of the PyPI package `json5`. The two
  # in one environment collide, so a dependency on `json5` must never be added
  # beside this one.
  "json-five>=1.1.2",
]

[project.urls]
Repository = "https://github.com/panlabs-tech/overpower"
Issues = "https://github.com/panlabs-tech/overpower/issues"

[project.scripts]
# package == command == `overpower`. `uvx <name>` resolves by *command* and
# infers the package by name equality; diverging forces `--from`.
# Measured in https://github.com/panlabs-tech/overpower/issues/3
overpower = "overpower.cli:main"

# The sdist declares what it carries, and the mechanism is an ALLOWLIST:
# docs/adr/0013-o-sdist-declara-o-que-carrega.md
#
# `include` is NOT one of the four keys ADR 0004 forbids, and the difference is
# mechanical rather than nominal. `force-include`, `artifacts`, `packages` and
# `ignore-vcs` punch *through* the `.gitignore` filter, which is what made the
# build depend on the machine that ran it — 2 of 2 locally, 1 of 2 in CI. An
# allowlist does the opposite: it cannot admit what nobody declared, so a dirty
# tree and a clean clone produce the same 105 files. Any of those four appearing
# in this file is still a regression until proven otherwise, and the proof still
# has to come from a CI build off a clean clone.
#
# Measured on 0.5.0: without this block the sdist is the whole repository — 172
# files, 1.308.825 bytes — and 67 of those files, 41% of the bytes, are `tests/`,
# `docs/`, `.github/` and tooling dotfiles that nothing downstream reads. The
# wheel rebuilt from the shrunken sdist is byte-identical: 105 entries, zero
# differing bytes.
#
# Eight files land regardless of what is written here — hatchling forces
# `pyproject.toml`, the `readme`, every `license-files` match, `.gitignore` and
# `PKG-INFO` in. Measured on purpose: an `exclude` naming all eight removes
# nothing. That is why the PEP 639 attribution of ADR 0003 cannot be lost to a
# wrong allowlist, and it is also why this line is not the whole guard — P3 in
# `.github/workflows/ci.yml` is what fails when `src/` stops being the right
# expression and a tracked file goes missing from the sdist.
[tool.hatch.build.targets.sdist]
include = ["src/"]

# --------------------------------------------------------------------------- #
# Project management — https://github.com/panlabs-tech/overpower/issues/2
# --------------------------------------------------------------------------- #

[tool.uv]
# `uv version` (used by the release gate and by the tagger) and dynamic
# versioning are mutually exclusive, so the floor is declared rather than
# inferred.
required-version = ">=0.11"

[dependency-groups]
# `pyright` drags a Node runtime with it, so it lives in its own group and the
# `test` matrix never pays for it. There is no task runner and there will not be
# one: the four commands in README.md are the whole loop.
dev = ["pytest>=9", "pytest-randomly", "ruff", "towncrier"]
typecheck = ["pyright"]

# Deliberately absent, and each absence is a decision of
# https://github.com/panlabs-tech/overpower/issues/30:
#   pytest-cov  — coverage is an ephemeral diagnostic, never a gate. The command
#                 lives in README.md and installs the plugin with `--with`.
#   syrupy      — the snapshot comparator is ~15 lines in tests/support.
#   freezegun   — the product never reads a clock.

# --------------------------------------------------------------------------- #
# Lint and format — https://github.com/panlabs-tech/overpower/issues/2
# --------------------------------------------------------------------------- #

[tool.ruff]
# 100 and not the default 88, decided in
# https://github.com/panlabs-tech/overpower/issues/24 against a real specimen of
# the org (90 files, 20740 lines, strictly annotated): 88 rewraps 2.71% of the
# lines, 98 rewraps 0.25%, 100 rewraps none. 98 and 100 tie on measurement, and
# 100 wins the tie-break on explanation cost.
line-length = 100
src = ["src"]
# Markdown is out, and it is not a taste call. Since 0.16 `ruff format` rewrites
# Python blocks *inside* `.md`, and `docs/` here is a decision archive whose
# blocks are quotations from closed tickets — reformatting them edits the
# record. It also removes a local×CI divergence: the lefthook hook is scoped to
# `*.py`, so a markdown-only reformat would pass locally and fail in CI, which
# is the false-green that rule 41 of the org standard exists to forbid.
extend-exclude = ["*.md"]
# `target-version` is deliberately NOT declared: ruff infers it from
# `requires-python`, and writing it here creates a second source for the floor.

[tool.ruff.lint]
# `extend-select`, never `select`. Measured on ruff 0.16.1: `select` with these
# families enables 253 rules, `extend-select` with the same families enables
# 495, and writing no config at all enables 413 — so a `select` list reads like
# tightening while being 160 rules *looser* than silence.
extend-select = [
  "E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF",
  "PTH", "ANN", "TC", "S", "PT", "D",
  "EM", "TRY", "RSE", "RET",
  "T20", "ARG", "SLF", "TID", "INP",
  "C4", "C90", "PERF", "FURB", "PIE", "PL",
  "DTZ", "LOG", "G", "A", "ERA", "FBT",
]
ignore = [
  "D203",    # incompatible with D211, which the google convention picks
  "D213",    # incompatible with D212, which the google convention picks
  "FBT002",  # a boolean *default* is fine; FBT001/FBT003 still guard the call
  "TRY003",  # long messages outside the exception class; EM handles the real trap
]
# `›` is the product's own punctuation for *a key inside a document* —
# `.mcp.json › mcpServers.cloudflare`, decided with the graft in
# https://github.com/panlabs-tech/overpower/issues/76. RUF001 is right that it
# resembles `>`, and that is exactly why it is not `>`: the plan line sits next
# to lines meant to be pasted into a shell, where `>` reads as a redirect.
# Allowed once, here, rather than suppressed at each of the sites that draw it.
allowed-confusables = ["›"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# The JSON tripwire, and it has to exist *before* the first `json.load` is
# written or it buys nothing. Measured in #2: pyright strict has a blind spot
# here — explicit `Any` is not `Unknown`, so `return data["name"]` inside a
# `-> str` function passes the type checker. Confining decoding to one module
# that returns `object` is what makes all three checkers see the bug, and
# `TID251` is what makes the confinement enforced rather than remembered.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"json.load" = { msg = "use overpower.jsonio.load_json, which returns object" }
"json.loads" = { msg = "use overpower.jsonio.loads_json, which returns object" }

[tool.ruff.lint.per-file-ignores]
# The sanctioned module. It does not exist yet — it is born with the first
# catalog read — and the exemption is written now so the tripwire above cannot
# be defused by deleting it later.
"src/overpower/jsonio.py" = ["TID251"]
# Tests assert with `assert` (S101), reach into privates on purpose (SLF001),
# compare against literals (PLR2004) and do not document themselves (D, ANN).
# INP001 is here because `--import-mode=importlib` makes the implicit-namespace
# complaint false: the tests package has an `__init__.py` and is imported by
# path, not by `sys.path` insertion.
"tests/**" = ["S101", "D", "ANN", "SLF001", "PLR2004", "INP001"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# Typing — https://github.com/panlabs-tech/overpower/issues/2
# --------------------------------------------------------------------------- #

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
# The FLOOR, not the dev version: the checker has to see what the oldest
# supported interpreter sees.
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# --------------------------------------------------------------------------- #
# Tests — https://github.com/panlabs-tech/overpower/issues/2 and /issues/30
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# `--import-mode=importlib` is the other half of the `src/` layout: it keeps
# `sys.path` untouched, so a test cannot import the source tree through the back
# door when the installed package is broken.
addopts = "-ra --import-mode=importlib"
# pytest 9's single switch. It subsumes `--strict-markers` and `--strict-config`
# and adds two the prior art does not have: `strict_xfail` (an xfail that passes
# fails) and `strict_parametrization_ids` (duplicate ids are a collection error).
strict = true
filterwarnings = ["error"]
# A closed inventory with exactly one member. Under `strict`, an undeclared
# marker is a collection error rather than a warning that nobody reads.
markers = ["network: talks to GitHub; a curation step, never a gate"]
required_plugins = ["pytest-randomly"]

# --------------------------------------------------------------------------- #
# CHANGELOG — https://github.com/panlabs-tech/overpower/issues/2
# --------------------------------------------------------------------------- #

# The six Keep a Changelog sections replace towncrier's defaults (`feature`,
# `bugfix`, `doc`, `removal`, `misc`): the output format is the decision, so the
# vocabulary has to be the reader's. The issue link comes free from the fragment
# filename, which turns the CHANGELOG into a navigable index of the map.
#
# THE TYPES ARE ALSO THE VERSION. Since
# https://github.com/panlabs-tech/overpower/issues/62 the `release-ready` check
# reads the section titles back off the CHANGELOG and refuses a bump smaller
# than they ask for — `breaking`/`removed` major, `added`/`changed`/`deprecated`
# minor, `fixed`/`security` patch, with major capped at minor while the project
# is 0.x. Renaming a `name` here therefore moves a release gate, and the gate
# builds its title -> type map from these very blocks so the two cannot drift.
#
# `breaking` is a SEVENTH type, and the deviation from Keep a Changelog is
# assumed: the spec has no section for a break, so `changed` was carrying both
# "the banner shows the alias" and "the default scope became global". The
# alternative was electing `removed` as the signal and asking whoever changes a
# default to write "the old behaviour was removed" — a rule that lives in
# somebody's head, which is the failure class ADR 0012 exists to delete. It is
# declared FIRST because the block order is the output order, and a break is
# what a consumer most needs to find.
[tool.towncrier]
name = "overpower"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/panlabs-tech/overpower/issues/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
