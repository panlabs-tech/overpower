# Not invented either: this is the `hostinger-vps` entry four repositories of
# this organisation keep by hand, and the four **disagree about whether it needs
# a token at all** — three carry `"env": {}` and one carries the slot. The server
# needs it, so this is the copy that stops being copied.
description = """\
Hostinger's API server, run as a local process. It manages VPS instances, DNS \
records and domains through the Hostinger API, and every call it makes is \
authorised with your API token — so the token has to be in the environment the \
runtime starts in.\
"""

transport = "stdio"

# The version is pinned exactly, and `@latest` is forbidden in an embedded
# recipe: a server that resolves a new package on every start changes behaviour
# with nobody having changed anything, and the version it changed at is written
# down nowhere.
[server]
command = "npx"
args = ["-y", "--package", "hostinger-api-mcp@0.2.5", "hostinger-vps-mcp"]

[[slots]]
name = "HOSTINGER_API_TOKEN"
role = "env"

# The twin of the declaration in `coolify.toml`, and for the same reason: this
# server is a process `npx` launches, so a machine without Node cannot run what
# the write would configure. Declared here rather than assumed, because what
# reproved was never requiring tooling — it was requiring it without saying so.
[[preconditions]]
check = "command_exists"
value = "npx"
