# The gate on every pull request. Seven checks, all blocking, across four jobs —
# decided in https://github.com/ThiagoPanini/overpower/issues/24 and grown twice
# since: `release-ready` in
# https://github.com/ThiagoPanini/overpower/issues/62 and P3 in
# https://github.com/ThiagoPanini/overpower/issues/71.
#
# There is deliberately NO `on: pull_request` trigger, and the absence is the
# decision. A check run is attached to the *SHA*, not to the event, so the run
# that fires on the push to the feature branch already satisfies the required
# status check of the pull request. Adding the trigger would instead create runs
# in `approval-required` state whenever the PR was opened with `GITHUB_TOKEN`,
# and clearing that needs a PAT or an App token — a credential back in the repo,
# which is the property the release path exists to celebrate not having.
name: CI

on:
  push:
    # `branches` and not the bare `push`: without the filter this also fires on
    # the tags the release path creates, duplicating the release run.
    branches: ["**"]

env:
  # Pinned to the same uv the release workflow uses. One version of the
  # resolver, one lockfile reading, no local-versus-CI divergence.
  UV_VERSION: "0.12.1"

jobs:
  # Five of the six checks have no sensitivity to OS or Python version. Running
  # them across the matrix would pay 9x a fixed ~10 s of job overhead for the
  # same answer: measured, the whole battery is ~2 s of actual work.
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # `--locked` fails instead of silently re-resolving: the lockfile is the
      # single source of tool versions, and it is what makes `uv run ruff` here
      # and `uv run ruff` in the lefthook hook the same ruff.
      - name: Install the locked environment
        run: uv sync --locked --all-groups

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: pyright
        run: uv run --group typecheck pyright

      # P1 — everything under content/ is really tracked by git.
      # https://github.com/ThiagoPanini/overpower/issues/11
      #
      # Two assertions, and the first one is what
      # https://github.com/ThiagoPanini/overpower/issues/45 switched on. Measured,
      # with the directory absent `git ls-files --others --ignored` exits 0 with
      # empty output and puts its warning on stderr only — so while the content
      # root did not exist this gate passed by vacuity, which is precisely the
      # failure class it exists to catch. The root is tracked now, so its absence
      # is a regression rather than a not-yet, and a subjectless P1 is a failure.
      - name: P1 — no ignored file hiding inside content/
        run: |
          tracked="$(git ls-files -- src/overpower/content/ | wc -l)"
          if [ "$tracked" -eq 0 ]; then
            echo "::error::git tracks nothing under src/overpower/content/; P1 has no subject"
            exit 1
          fi
          hidden="$(git ls-files --others --ignored --exclude-standard -- src/overpower/content/)"
          if [ -n "$hidden" ]; then
            echo "::error::files under content/ are ignored by git and will not reach the wheel:"
            echo "$hidden"
            exit 1
          fi
          echo "P1 ok: $tracked tracked path(s) under content/, none hidden from git"

      # P2 — what git tracks under content/ is what the wheel carries.
      # It costs one `uv build` (measured at 0.54 s) and it runs here rather
      # than only at release: the tag is born from the merge, so a release-only
      # P2 would find the divergence *after* main already had it.
      - name: P2 — the wheel carries exactly what git tracks
        run: |
          uv build --no-sources
          python3 - <<'PY'
          import glob
          import subprocess
          import sys
          import zipfile

          prefix = "src/overpower/"
          # `-z`, not a whitespace split: `git ls-files` separates by newline and
          # *quotes* a path that carries a space or a non-ASCII byte, so a naive
          # split would invent missing and extra entries out of one vendored
          # filename. Today's content has neither, and the point of a gate is to
          # still be right when tomorrow's does.
          tracked = {
              path[len(prefix):]
              for path in subprocess.run(
                  ["git", "ls-files", "-z", "--", "src/overpower/content"],
                  capture_output=True, text=True, check=True,
              ).stdout.split("\0")
              if path
          }
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          inside = {
              name[len("overpower/"):]
              for name in zipfile.ZipFile(wheel).namelist()
              if name.startswith("overpower/content/")
          }

          missing = sorted(tracked - inside)
          extra = sorted(inside - tracked)
          for name in missing:
              print(f"::error::tracked but absent from the wheel: {name}")
          for name in extra:
              print(f"::error::in the wheel but not tracked by git: {name}")
          if missing or extra:
              sys.exit(1)
          print(f"P2 ok: {len(tracked)} tracked path(s) under content/, all present in {wheel}")
          PY

      # P3 — the sdist carries exactly what it declared.
      # https://github.com/ThiagoPanini/overpower/issues/71
      #
      # It costs no build: the P2 step above already ran `uv build --no-sources`,
      # which writes the sdist beside the wheel, so this reads `dist/` as it is.
      #
      # THE DIRECTION IS NOT THE ONE THE TICKET ASKED FOR, and the difference is
      # the whole reason this gate is worth having. A P3 that existed to catch an
      # untracked file leaking into the sdist would be vacuously green forever:
      # `actions/checkout` materializes only what git tracks, so the intruder
      # cannot exist here — the same trap #45 found in P1 while the content root
      # did not exist. What closes the leak is the allowlist in `pyproject.toml`,
      # by construction (docs/adr/0013-o-sdist-declara-o-que-carrega.md). What
      # this gate catches is that allowlist going STALE — the day `src/` stops
      # being the right expression and a tracked file silently stops travelling.
      # That direction CI can see, and it is measured red: an allowlist narrowed
      # to `src/overpower/content/` drops 15 tracked `.py` files.
      #
      # The first clause stays anyway, because it costs nothing and it is what
      # fails if someone reaches for one of the four keys ADR 0004 forbids — the
      # only mechanism left that can put an untracked file in the sdist.
      - name: P3 — the sdist carries exactly what it declared
        run: |
          python3 - <<'PY'
          import glob
          import subprocess
          import sys
          import tarfile

          # `-z`, like P2 above, and for the same reason: `git ls-files` quotes a
          # path carrying a space or a non-ASCII byte, so a naive split would
          # invent both an intruder and an absence out of one filename.
          tracked = {
              path
              for path in subprocess.run(
                  ["git", "ls-files", "-z"],
                  capture_output=True, text=True, check=True,
              ).stdout.split("\0")
              if path
          }
          sdist = sorted(glob.glob("dist/*.tar.gz"))[-1]
          with tarfile.open(sdist) as tar:
              root = tar.getnames()[0].split("/")[0] + "/"
              # PKG-INFO is written by the build and exists in no tree. It is the
              # only exemption needed: every other file hatchling forces in —
              # `pyproject.toml`, the readme, the `license-files` matches and
              # `.gitignore` — is tracked, so it answers the first clause on its
              # own.
              inside = {
                  member.name[len(root):] for member in tar.getmembers() if member.isfile()
              } - {"PKG-INFO"}

          stray = sorted(inside - tracked)

          # `src/` IS WRITTEN OUT, and it is deliberately not read back off
          # `[tool.hatch.build.targets.sdist]`. That reads like the second-source
          # duplication `release-ready` avoids below, and it is the opposite:
          # there, the title -> type map and the fragment types are two spellings
          # of one fact; here, the `include` is the implementation and this line
          # is the assertion. Measured — a clause that derives its expectation
          # from `include` goes GREEN on `include = ["src/overpower/content/"]`,
          # because a narrowed allowlist is self-consistent. It would assert that
          # hatchling implements `include`, which is nobody's failure mode, and
          # it is the same vacuity ADR 0013 exists to refuse.
          #
          # The known limit of writing it out: an `include` that GROWS an entry
          # is not asserted until this line grows with it. Narrowing — the
          # direction that loses files — fails loudly, and that is the one the
          # gate is for.
          missing = sorted(path for path in tracked - inside if path.startswith("src/"))

          for name in stray:
              print(f"::error::in the sdist but not tracked by git: {name}")
          for name in missing:
              print(f"::error::tracked under src/ and absent from the sdist: {name}")
          if stray or missing:
              sys.exit(1)
          print(f"P3 ok: {len(inside)} file(s) in {sdist}, all tracked, none missing under src/")
          PY

  # Only pytest varies with OS and Python version, and it varies for a reason:
  # what the suite exercises is the filesystem, which is precisely what differs
  # across the nine cells. The floor is not arbitrary either — `os.path.isjunction`
  # does not exist in 3.11 and does in 3.12+, and it is the predicate #19 fixed
  # as the correct one for removing a junction.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # Without `--all-groups`: pyright drags a Node runtime, and the matrix has
      # no use for it.
      - name: Install the locked environment
        run: uv sync --locked

      # `windows-latest` proves the path *with* symlink privilege and not
      # without it — the runner image enables Developer Mode and runs as an
      # administrator (#19). The unprivileged branch stays observable only on
      # the dev machine, and that absence is declared, not covered.
      - name: pytest
        run: uv run pytest

  # The SECOND required check, and it is deliberately not a step inside
  # `static`. https://github.com/ThiagoPanini/overpower/issues/62
  #
  # `gate` means "the code is sound". A version step inside it would leave every
  # pull request red from the first draft push until the last commit, and the two
  # failures — *fix the code* and *bump the version* — would arrive under one
  # name with different remedies. One name per remedy is what makes an autonomous
  # agent get it right on the first read.
  #
  # THE JOB IS ALSO THE INSTRUCTION. Nothing anywhere tells an author to bump:
  # the red check prints the inferred level and the two commands. That is the
  # whole reason no skill, no doc and no bot participates — see
  # docs/adr/0012-o-bump-e-ato-do-autor-e-o-portao-o-ensina.md.
  #
  # No `uv` here on purpose: `tomllib` reads the version and the rest is `git`,
  # so this runs beside `static` and `test` and costs ~0 of wall-clock.
  release-ready:
    name: release-ready
    # On `main` the authority is `tag.yml`, which asks the same question against
    # the tag. Running both would race over the tag that `tag.yml` is creating.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both inputs die in a shallow clone: the merge-base against `main`,
          # and the existence of the tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Merging this publishes a version PyPI does not have
        run: |
          git fetch --quiet origin main
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys
          import tomllib

          RANK = {"patch": 0, "minor": 1, "major": 2}
          # docs/adr/0012. `removed` rides with `breaking` because in a CLI,
          # removing something visible *is* a break, and splitting them would
          # hand back to the author the rule "remember to also write a
          # `breaking`" — the class of failure the gate exists to delete.
          LEVEL = {
              "breaking": "major", "removed": "major",
              "added": "minor", "changed": "minor", "deprecated": "minor",
              "fixed": "patch", "security": "patch",
          }
          # The trigger is the WHEEL, and this tuple used to be a CHOICE between
          # two artifacts: the published sdist was the whole repository — 164
          # files, `docs/` and `tests/` included — so under the sdist reading a
          # comma in an ADR would have published a version.
          #
          # THAT PREMISE IS GONE. The allowlist of
          # docs/adr/0013-o-sdist-declara-o-que-carrega.md made the sdist `src/`
          # plus the eight files hatchling forces in, so the two readings
          # converge onto this very tuple. What survives of the divergence is
          # `.gitignore` and the `[tool.*]` half of `pyproject.toml`, which
          # travel in the sdist and are not the product. The tuple is unchanged
          # and is now a description of both artifacts rather than a preference
          # between them.
          WHEEL = ("src/", "README.md", "NOTICE", "LICENSE", "licenses/")

          def git(*args: str) -> str:
              out = subprocess.run(["git", *args], capture_output=True, text=True, check=True)
              return out.stdout

          def fail(*lines: str) -> None:
              for line in lines:
                  print(f"::error::{line}")
              sys.exit(1)

          def parse(raw: str) -> tuple[int, int, int]:
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", raw)
              if m is None:
                  fail(f'version "{raw}" is not X.Y.Z; this gate cannot classify the bump')
              return tuple(int(g) for g in m.groups())  # type: ignore[union-attr]

          def moved(old: tuple[int, ...], new: tuple[int, ...]) -> str:
              if new[0] != old[0]:
                  return "major"
              return "minor" if new[1] != old[1] else "patch"

          def required(types, old: tuple[int, ...]) -> str | None:
              levels = [LEVEL[t] for t in types if t in LEVEL]
              if not levels:
                  return None
              top = max(levels, key=lambda name: RANK[name])
              # SemVer section 4: in 0.x nothing is stable, so a break does not
              # promote. Going to 1.0.0 stays an explicit act.
              return "minor" if top == "major" and old[0] == 0 else top

          base = git("merge-base", "origin/main", "HEAD").strip()
          head_pp = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          base_pp = tomllib.loads(git("show", f"{base}:pyproject.toml"))

          # `-z`, like P2 above: `git diff --name-only` quotes a path carrying a
          # space or a non-ASCII byte, and a naive split would invent entries.
          changed = [p for p in git("diff", "--name-only", "-z", base, "HEAD").split("\0") if p]
          touched = [p for p in changed if p.startswith(WHEEL)]
          # Only the `[project]` table. Changing a ruff rule is not a release,
          # and `[tool.*]` shares the file with what actually ships.
          if "pyproject.toml" in changed and head_pp["project"] != base_pp["project"]:
              touched.append("pyproject.toml [project]")

          if not touched:
              print(f"release-ready ok: {len(changed)} path(s) changed, none of them reach the wheel")
              sys.exit(0)

          version = head_pp["project"]["version"]
          base_version = base_pp["project"]["version"]
          new, old = parse(version), parse(base_version)

          fragments = sorted(
              p.name.split(".")[1]
              for p in pathlib.Path("changelog.d").iterdir()
              if p.name != ".gitkeep" and len(p.name.split(".")) >= 3
          )

          # --- 1. the version moved, and nobody published this number first
          if new <= old:
              need = required(fragments, old)
              if need is None:
                  fail(
                      f"this pull request changes the wheel ({', '.join(touched[:4])}) "
                      f"and the version is still {version}.",
                      "there is no fragment in changelog.d/ to infer the level from.",
                      "write changelog.d/<issue>.<type>.md — type is one of "
                      + "|".join(LEVEL),
                  )
              fail(
                  f"this pull request changes the wheel and the version is still {version}.",
                  f"the fragments in changelog.d/ ask for: {need}",
                  f"  uv version --bump {need}",
                  '  uv run towncrier build --version "$(uv version --short)"',
              )

          if git("tag", "--list", f"v{version}").strip():
              fail(
                  f"version {version} is already tagged — another pull request published "
                  "this number first.",
                  "rebase onto main and bump again:",
                  "  uv version --bump <patch|minor|major>",
                  '  uv run towncrier build --version "$(uv version --short)"',
              )

          # --- 2, 3 and 4. The fragments are gone by now — towncrier consumed
          # them — so the level is read back off the CHANGELOG. Reading the tree
          # at HEAD and not `git log` is deliberate: a fragment written *and*
          # consumed inside one commit exists in neither tree and would make any
          # diff-based inference silently answer "no level".
          problems: list[str] = []
          section = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              pathlib.Path("CHANGELOG.md").read_text(),
              re.MULTILINE | re.DOTALL,
          )
          if section is None:
              problems += [
                  f"CHANGELOG.md has no ## [{version}] section; towncrier never ran for it.",
                  '  uv run towncrier build --version "$(uv version --short)"',
              ]
          if fragments:
              problems.append(
                  "fragments survived the bump and would never reach any release: "
                  + ", ".join(fragments)
              )
          if section is not None:
              # The title -> type map is not a second source: it comes from the
              # `[[tool.towncrier.type]]` blocks, which already pair them.
              by_title = {t["name"]: t["directory"] for t in head_pp["tool"]["towncrier"]["type"]}
              titles = re.findall(r"^### (.+)$", section.group(1), re.MULTILINE)
              if not titles:
                  problems.append(
                      f"## [{version}] carries no entry, and this pull request changes the wheel."
                  )
              need = required([by_title.get(t.strip(), "") for t in titles], old)
              got = moved(old, new)
              # A FLOOR, not equality: over-bumping is how `uv version 1.0.0`
              # stays possible without a special case.
              if need is not None and RANK[got] < RANK[need]:
                  problems.append(
                      f"## [{version}] carries {', '.join(titles)}, which asks for {need}, "
                      f"but {base_version} -> {version} is {got}."
                  )
          if problems:
              fail(*problems)

          print(
              f"release-ready ok: {base_version} -> {version} ({moved(old, new)}), "
              f"CHANGELOG.md closed, changelog.d/ empty"
          )
          PY

  # The one name the ruleset requires. It exists for mechanics, not elegance: a
  # required check is remembered *by name*, and a matrix cell's name carries the
  # matrix values — so without this job, changing the matrix would leave the
  # ruleset waiting on a check that no longer reports, and every pull request
  # would hang on "Expected — waiting for status to be reported", forever.
  #
  # `if: always()` plus the explicit assertion below, and not the empty job the
  # decision sketched: a job skipped because a dependency failed reports as
  # *skipped*, and GitHub treats a skipped required check as successful. An
  # empty `needs: [static, test]` job would therefore go green exactly when the
  # gate had something to say.
  #
  # A THIRD DEPENDENCY LIVED HERE AND DOES NOT ANY MORE. `site` built the
  # Docusaurus site in `website/` and ran its four CSS gates; the documentation
  # moved to `ThiagoPanini/panlabs-docs` and `website/` left with it
  # (https://github.com/ThiagoPanini/overpower/issues/151). What is gone is the
  # subject, not the rule — a Node surface that comes back brings its job and its
  # line in `needs` together, because a gate that does not block a merge protects
  # nothing.
  gate:
    name: gate
    needs: [static, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every gate reported success
        env:
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "static=$STATIC test=$TEST"
          [ "$STATIC" = "success" ] || { echo "::error::static did not succeed"; exit 1; }
          [ "$TEST" = "success" ] || { echo "::error::test did not succeed"; exit 1; }
